<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cc8ff">
<title>Mi Pueblito</title>
<style>
  :root { --fg: #1f2937; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; color: var(--fg); background: #7cc8ff; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

  #barra { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 30; display: flex; gap: 8px; align-items: center; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); background: linear-gradient(#ffffffcc, #ffffff00); }
  .chip { background: #fffffff0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 #0002; white-space: nowrap; }
  .boton { width: 44px; height: 44px; border-radius: 14px; background: #fffffff0; font-size: 24px; display: grid; place-items: center; box-shadow: 0 3px 0 #0002; flex: none; }
  .boton.on { background: #fde047; transform: translateY(2px); }
  .espacio { flex: 1; min-width: 0; }
  #cLugar { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  #candado.cargando { animation: llenar 3s linear forwards; }
  @keyframes llenar { from { box-shadow: inset 0 0 0 0 #0003; } to { box-shadow: inset 0 0 0 24px #0003; } }

  #vista { position: fixed; left: 0; right: 0; top: 0; bottom: 84px; overflow: hidden; }
  #lienzo { position: absolute; left: 0; top: 0; height: 900px; transform-origin: 0 0; }
  .fondo { position: absolute; inset: 0; }
  .cuarto { position: absolute; top: 0; height: 900px; }
  .pared { position: absolute; left: 0; right: 0; top: 0; height: 760px; }
  .piso { position: absolute; left: 0; right: 0; top: 760px; bottom: 0; }
  .zoclo { position: absolute; left: 0; right: 0; top: 744px; height: 16px; background: #0002; }
  .ventana { position: absolute; top: 170px; width: 170px; height: 200px; border: 12px solid #fff; border-radius: 14px; background: linear-gradient(#7cc8ff, #d6f1ff); overflow: hidden; box-shadow: inset 0 0 0 4px #0001; }
  .ventana::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #fff; }
  .ventana .astro { position: absolute; right: 14px; top: 14px; font-size: 40px; }
  .divisor { position: absolute; top: 0; width: 28px; height: 500px; background: #e7d3b5; box-shadow: inset 0 -10px 0 #0001; }
  .nombreCuarto { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 30px; color: #0003; pointer-events: none; }

  .ent { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; touch-action: none; }
  .ent svg { display: block; overflow: visible; }
  .ent .emo { display: block; width: 100%; height: 100%; text-align: center; line-height: 1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .ent.levantado { z-index: 50 !important; filter: drop-shadow(0 18px 10px #0004); }
  .ent.cae { transition: transform var(--t, .3s) cubic-bezier(.5, 0, .9, .6); }
  .ent.flota { transition: transform 2.5s ease-out; }
  .ent.brinca > * { animation: brinca .45s; }
  @keyframes brinca { 40% { transform: translateY(-30px); } }
  .ent.aplasta > * { animation: aplasta .25s; }
  @keyframes aplasta { 40% { transform: scaleY(.85) scaleX(1.1); } }
  .cuerpo { position: absolute; left: 0; top: 0; }
  .ojos { animation: parpadeo 4.5s infinite; transform-origin: 60px 52px; }
  @keyframes parpadeo { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .bocaAbierta { display: none; }
  .comiendo .boca { display: none; }
  .comiendo .bocaAbierta { display: inline; }
  .tele-on .pantalla { animation: tele 2s linear infinite; }
  @keyframes tele { 0% { fill: #60a5fa; } 33% { fill: #f472b6; } 66% { fill: #4ade80; } 100% { fill: #60a5fa; } }
  .tele-on .show { display: inline; }
  .show { display: none; }
  .fuego { display: none; }
  .estufa-on .fuego { display: inline; animation: fuego .3s infinite alternate; transform-origin: center bottom; transform-box: fill-box; }
  @keyframes fuego { to { transform: scaleY(1.25); } }
  .abierto .puerta { transform: scaleX(.15); }
  .puerta { transition: transform .3s; transform-box: fill-box; transform-origin: right center; }
  .burbuja { position: absolute; font-size: 44px; pointer-events: none; animation: sube 1.6s ease-out forwards; z-index: 60; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  @keyframes sube { from { transform: translate(-50%, 0) scale(.5); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -20px) scale(1); } to { transform: translate(-50%, -110px); opacity: 0; } }
  .brillo { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(#fff7a8cc, #fde04722 55%, transparent 70%); z-index: 21; }
  #oscuro { position: absolute; inset: 0; background: #0b1440; opacity: 0; pointer-events: none; transition: opacity .8s; z-index: 20; }
  .noche #oscuro { opacity: .55; }

  /* Mapa del pueblo */
  .lugar { position: absolute; bottom: 140px; width: 300px; height: 380px; }
  .lugar svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lugar .letrero { position: absolute; left: 50%; bottom: -60px; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 6px 16px; font-weight: 900; font-size: 22px; white-space: nowrap; box-shadow: 0 4px 0 #0002; }
  .lugar.pronto { filter: saturate(.55); }
  .lugar.pronto::after { content: '🚧'; position: absolute; right: 10px; top: 120px; font-size: 64px; }
  .lugar.sacude { animation: sacude .4s; }
  @keyframes sacude { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

  /* Mochila, cajón de muebles, pintura y basura */
  #bolsillo { position: fixed; left: 0; right: 0; bottom: 0; height: 84px; z-index: 30; background: #7c4a21; display: flex; align-items: center; gap: 8px; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); box-shadow: 0 -4px 0 #0002; }
  #bolsillo .lbl { font-size: 34px; flex: none; }
  #ranuras { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .ranura { flex: none; width: 64px; height: 64px; border-radius: 16px; background: #a0632e; box-shadow: inset 0 3px 0 #0003; display: grid; place-items: center; font-size: 38px; overflow: hidden; touch-action: none; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .ranura svg { width: 54px; height: 54px; }
  #bolsillo.resalta { background: #9a5b2a; outline: 4px dashed #fde047; outline-offset: -6px; }
  #cajon, #paleta { position: fixed; left: 8px; right: 8px; bottom: 92px; z-index: 31; background: #fffffff2; border-radius: 22px; padding: 10px; box-shadow: 0 6px 0 #0002; display: none; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #cajon.abierto, #paleta.abierto { display: flex; }
  #cajon button { flex: none; width: 76px; height: 76px; border-radius: 16px; background: #f1f5f9; display: grid; place-items: center; font-size: 42px; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  #cajon button svg { width: 62px; height: 62px; }
  #paleta button { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 2px 0 #0003; }
  #paleta button.sel { outline: 4px solid #1f2937; }
  #paleta .ayuda { align-self: center; font-weight: 800; padding: 0 8px; white-space: nowrap; }
  #basura { position: fixed; right: 12px; top: 70px; width: 84px; height: 84px; border-radius: 24px; background: #fee2e2; font-size: 48px; display: none; place-items: center; z-index: 40; box-shadow: 0 4px 0 #0002; }
  #basura.ver { display: grid; }
  #basura.encima { background: #fca5a5; transform: scale(1.15); }

  .capa { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: #0007; padding: 16px; }
  .capa.abierta { display: grid; }
  .tarjeta { background: #fff; border-radius: 24px; padding: 20px; width: min(94vw, 520px); max-height: 92vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .opc { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .opc input { width: 22px; height: 22px; }
  .btn { background: #f1f5f9; border-radius: 999px; padding: 10px 16px; font-weight: 700; }
  .btn.principal { background: #1f2937; color: #fff; }
  .btn.peligro { background: #fee2e2; color: #b91c1c; }
  .agua { position: absolute; background: linear-gradient(#38bdf855, #0369a155); pointer-events: none; z-index: 47; border-top: 6px solid #e0f2fe99; }
  .nadando .cuerpo { animation: nada 1.6s ease-in-out infinite alternate; }
  @keyframes nada { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-10px) rotate(3deg); } }
  .flotando > svg { animation: nada 2.2s ease-in-out infinite alternate; }
  .pez .emo { animation: nadarPez 3.5s ease-in-out infinite alternate; }
  @keyframes nadarPez { from { transform: translateX(-40px); } to { transform: translateX(40px) translateY(-8px); } }
  .flores-suelo { position: absolute; left: 0; right: 0; top: 724px; font-size: 34px; letter-spacing: 26px; white-space: nowrap; overflow: hidden; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .suelo-otono { position: absolute; left: 0; right: 0; top: 560px; bottom: 0; background: linear-gradient(transparent, #eab30866 16%, #d9770680); }
  .estacion-verano { background: radial-gradient(circle at 85% 12%, #fde04755, transparent 40%); }
  [data-estacion="invierno"] .arbolEnt.palmeraEnt svg { filter: brightness(1.1) saturate(.8); }
  .filaPanel button small { display: block; }
  .climaCapa { position: absolute; top: 0; height: 900px; pointer-events: none; z-index: 19; overflow: hidden; }
  .clima-lluvia { background: repeating-linear-gradient(100deg, transparent 0 22px, #ffffff88 22px 24px, transparent 24px 46px), #47556966; background-size: 46px 120px; animation: llueve .35s linear infinite; }
  @keyframes llueve { to { background-position: -10px 120px; } }
  .clima-nieve { background-image: radial-gradient(#fff 3px, transparent 4px), radial-gradient(#fff 2px, transparent 3px); background-size: 90px 90px, 60px 60px; background-position: 0 0, 30px 30px; animation: nieva 4s linear infinite; background-color: #e0f2fe33; }
  @keyframes nieva { to { background-position: 30px 360px, 50px 240px; } }
  .suelo-nieve { position: absolute; left: 0; right: 0; top: 742px; height: 34px; background: #f8fafc; border-radius: 20px 20px 0 0; }
  .charco { position: absolute; top: 762px; width: 180px; height: 22px; margin-left: -90px; border-radius: 50%; background: #60a5fa99; }
  .hoja { position: absolute; top: -60px; font-size: 40px; animation: cae-hoja linear infinite; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  @keyframes cae-hoja { 0% { transform: translateY(0) rotate(0); } 50% { transform: translate(40px, 480px) rotate(180deg); } 100% { transform: translate(-20px, 980px) rotate(360deg); } }
  .despega > svg { animation: despega 1.2s ease-in forwards; }
  @keyframes despega { to { transform: translate(900px, -700px) scale(.4); opacity: .3; } }
  .aterriza > svg { animation: aterriza 1.3s ease-out; }
  @keyframes aterriza { from { transform: translate(-900px, -700px) scale(.4); opacity: .3; } }
  .vuela .emo { animation: vuelaPaloma 2.6s ease-in-out; }
  @keyframes vuelaPaloma { 40% { transform: translate(500px, -300px); opacity: .2; } 60% { transform: translate(500px, -300px); opacity: .2; } }
  .foco { animation: foco 1s ease-in-out infinite alternate; }
  @keyframes foco { to { opacity: .35; } }
  .guirnalda { position: absolute; left: 0; top: 0; height: 130px; pointer-events: none; z-index: 18; }
  .sacudir > svg { animation: sacudirP .4s; transform-origin: 50% 0; }
  @keyframes sacudirP { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .llegaBus > svg { animation: llegaBus .9s ease-out; }
  @keyframes llegaBus { from { transform: translateX(-1400px); } }
  .seVaBus > svg { animation: seVaBus .9s ease-in forwards; }
  @keyframes seVaBus { to { transform: translateX(1600px); } }
  @keyframes flama { to { filter: brightness(1.25); margin-top: -4px; } }
  .botonPiz { position: absolute; top: 286px; width: 52px; height: 34px; border-radius: 10px; background: #fff; font-size: 20px; box-shadow: 0 3px 0 #0003; }
  .secreto .emo { animation: destello 2.6s ease-in-out infinite; }
  @keyframes destello { 0%, 80%, 100% { filter: none; } 90% { filter: drop-shadow(0 0 10px #fde047) brightness(1.3); } }
  .sirena-on .sirena { animation: sirena .35s infinite alternate; }
  @keyframes sirena { to { fill: #3b82f6; } }
  #albumSecretos { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .fichaSecreto { background: #fef3c7; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fichaSecreto span { font-size: 44px; line-height: 1.1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .fichaSecreto small { font-weight: 700; font-size: 12px; text-align: center; }
  .fichaSecreto.no { background: #f1f5f9; }
  .mece { transform-box: view-box; transform-origin: 115px 10px; }
  .meciendo .mece, .columpiando .cuerpo { animation: mece 1.4s ease-in-out infinite alternate; }
  @keyframes mece { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  .cola { transform-box: fill-box; transform-origin: 0% 100%; animation: cola .5s ease-in-out infinite alternate; }
  @keyframes cola { to { transform: rotate(-22deg); } }
  .badajo { transform-box: view-box; transform-origin: 55px 0; }
  .suena .badajo { animation: campana .45s ease-in-out 6 alternate; }
  @keyframes campana { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  .panelAbajo { position: fixed; left: 8px; right: 8px; bottom: 92px; z-index: 32; background: #fffffff5; border-radius: 22px; padding: 10px 52px 10px 10px; box-shadow: 0 6px 0 #0002; display: none; flex-direction: column; gap: 8px; }
  .panelAbajo.abierto { display: flex; }
  .filaPanel { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .filaPanel button { flex: none; width: 64px; height: 64px; border-radius: 16px; background: #f1f5f9; display: grid; place-items: center; overflow: hidden; padding: 0; }
  .filaPanel button svg { width: 60px; height: 60px; }
  .filaPanel button.sel { outline: 4px solid #22c55e; background: #dcfce7; }
  .filaPanel button.color { border-radius: 50%; width: 48px; height: 48px; border: 4px solid #fff; box-shadow: 0 2px 0 #0003; }
  .cerrarPanel { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; background: #f1f5f9; font-size: 18px; }
  #creaListo { align-self: center; background: #7c3aed; color: #fff; font-size: 26px; font-weight: 900; border-radius: 999px; padding: 8px 28px; box-shadow: 0 5px 0 #4c1d95; }
  .vapor { display: none; }
  .cocinando .vapor { display: inline; animation: vapor 1s ease-in-out infinite; }
  @keyframes vapor { 50% { opacity: .5; transform: translateY(-6px); } }
  .cocinando > svg { animation: hierve .3s infinite alternate; }
  @keyframes hierve { to { transform: translateY(-2px); } }
  .licuando > svg { animation: licua .08s infinite alternate; }
  @keyframes licua { from { transform: translateX(-3px) rotate(-2deg); } to { transform: translateX(3px) rotate(2deg); } }
  #cobroCosas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin-top: 20px; }
  .cosaCobro { display: flex; flex-direction: column; align-items: center; font-size: 46px; line-height: 1; }
  .cosaCobro b { font-size: 20px; background: #fef3c7; border: 2px solid #f59e0b; border-radius: 999px; padding: 0 10px; margin-top: 4px; }
  .mas { font-size: 28px; font-weight: 900; color: #94a3b8; }
  #cobroTotal { display: flex; flex-direction: column; align-items: center; }
  #cobroTotal span { font-size: 84px; font-weight: 900; line-height: 1; color: #b45309; }
  #cobroTotal small { font-size: 18px; font-weight: 800; }
  #cobroBandeja { min-height: 64px; width: 100%; background: #f1f5f9; border-radius: 18px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .monedaPuesta { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(#fde68a, #f59e0b); border: 3px solid #b45309; display: grid; place-items: center; font-weight: 900; font-size: 20px; animation: cae .3s ease-out; }
  @keyframes cae { from { transform: translateY(-40px); opacity: 0; } }
  #cobroMoneda { width: 110px; height: 110px; border-radius: 50%; background: #fef3c7; font-size: 64px; box-shadow: 0 6px 0 #f59e0b; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  #cobroMoneda:active { transform: translateY(4px); box-shadow: 0 2px 0 #f59e0b; }
  #cobroMoneda:disabled { opacity: .4; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #111d; color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; z-index: 45; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; max-width: 90vw; }
  #toast.ver { opacity: 1; }
  @media (max-width: 440px) { .chip { font-size: 14px; padding: 5px 9px; } .boton { width: 40px; height: 40px; font-size: 21px; } #barra { gap: 6px; } }
</style>
</head>
<body>
<header id="barra">
  <button id="bMapa" class="boton" title="Pueblo">🗺️</button>
  <span id="cLugar" class="chip"></span>
  <span class="espacio"></span>
  <button id="bBus" class="boton" title="Autobús">🚌</button>
  <button id="bSecretos" class="boton" title="Secretos">🔎</button>
  <button id="bNoche" class="boton" title="Día / noche">🌙</button>
  <button id="bMuebles" class="boton" title="Muebles y juguetes">🛋️</button>
  <button id="bPintar" class="boton" title="Pintar">🎨</button>
  <button id="candado" class="boton" title="Mantén presionado 3 segundos">🔒</button>
</header>

<div id="vista"><div id="lienzo"></div></div>
<div id="basura">🗑️</div>
<div id="cajon"></div>
<div id="paleta"></div>
<div id="estilista" class="panelAbajo">
  <div class="filaPanel" id="estPelo"></div>
  <div class="filaPanel" id="estColor"></div>
  <div class="filaPanel" id="estAcc"></div>
  <button class="cerrarPanel" id="estCerrar">✖️</button>
</div>
<div id="cielo" class="panelAbajo">
  <div class="filaPanel" id="estacionesLista"></div>
  <div class="filaPanel" id="cieloLista"></div>
  <button class="cerrarPanel" id="cieloCerrar">✖️</button>
</div>
<div id="vuelos" class="panelAbajo">
  <div class="filaPanel" id="vuelosLista"></div>
  <button class="cerrarPanel" id="vuelosCerrar">✖️</button>
</div>
<div id="rutas" class="panelAbajo">
  <div class="filaPanel" id="rutasLista"></div>
  <div style="display:flex;gap:8px"><button class="btn" id="rutaBajar">⬇️ 👥</button><button class="btn" id="rutaAdios">👋 🚌</button></div>
  <button class="cerrarPanel" id="rutasCerrar">✖️</button>
</div>
<div id="creador" class="panelAbajo">
  <div class="filaPanel" id="creaTam"></div>
  <div class="filaPanel" id="creaPiel"></div>
  <button id="creaListo">✨ 👤</button>
  <button class="cerrarPanel" id="creaCerrar">✖️</button>
</div>
<footer id="bolsillo"><span class="lbl">🎒</span><div id="ranuras"></div></footer>

<div id="panel" class="capa"><div class="tarjeta">
  <h2>⚙️ Ajustes para adultos</h2>
  <h3>Idioma / Language</h3>
  <div id="pIdioma"></div>
  <p style="color:#64748b;font-size:14px">Al tocar cada cosa, el juego dice su nombre en el idioma elegido. Todo se guarda solo en este aparato.</p>
  <button class="btn" id="bBorrarNuevos">Borrar los personajes creados en la cabina</button>
  <button class="btn peligro" id="bReiniciar">Empezar de nuevo (borrar la casa)</button>
  <button class="btn principal" id="bCerrarPanel">Listo 🔒</button>
</div></div>
<div id="cobro" class="capa"><div class="tarjeta" style="align-items:center;position:relative">
  <button class="chip" id="cobroOir" style="position:absolute;right:12px;top:12px">🔊</button>
  <div id="cobroCosas"></div>
  <div id="cobroTotal"></div>
  <div id="cobroBandeja"></div>
  <div style="display:flex;gap:14px;align-items:center">
    <button id="cobroMoneda">🪙</button>
    <button id="cobroListo" class="btn">✖️</button>
  </div>
</div></div>
<div id="album" class="capa"><div class="tarjeta" style="position:relative">
  <h2 id="tituloAlbum"></h2>
  <div id="albumSecretos"></div>
  <button class="btn principal" id="cerrarAlbum">👍</button>
</div></div>
<div id="toast"></div>

<script>
// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const azar = n => Math.floor(Math.random() * n);

  p.peso ||= { adulto: 55 + azar(30), nino: 18 + azar(14), bebe: 7 + azar(5) }[p.tam];
  [523, 659, 784].forEach((f, i) => tono(f, i * 0.12, 0.15, 'triangle', 0.1));

}

  for (const m of enEscena().filter(o => o.k === 'rayos_x')) {

    if (!!m.on === ocupada) continue;
    m.on = ocupada; dibujarElem(m); colocar(m);

    p.curitas = Math.min(3, (p.curitas || 0) + 1); dibujarElem(p); colocar(p); burbuja(p, '😊'); sfx.pop();

function actualizarColumpios() {   // el columpio se mece con quien está sentado

    if (cu) cu.style.transformOrigin = `50% ${(m.y - CAT[m.k].h + 10) - (p.y - h)}px`;   // gira desde el palo de arriba
  }

function enTobogan(x, y) { return enEscena().find(o => CAT[o.k]?.tobogan && Math.abs(x - (o.x - CAT[o.k].w / 2 + 45)) < 90 && y < o.y - 170 && y > o.y - 460); }
function puntoTobogan(t, s) {   // sigue la curva del dibujo de la resbaladilla
  const bz = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
  const [sx, sy] = s < 0.6 ? [bz(80, 170, 230, s / 0.6), bz(34, 60, 190, s / 0.6)] : [bz(230, 262, 330, (s - 0.6) / 0.4), bz(190, 262, 286, (s - 0.6) / 0.4)];
  return [t.x - CAT[t.k].w / 2 + sx, t.y - CAT[t.k].h + sy];
}
function resbalar(p, t) {
  p.pose = 'sentado'; p.mira = t.f ? -1 : 1; p.asiento = null; dibujarElem(p);
  const fin = [t.x + CAT[t.k].w / 2 + 50, PISO];
  [523, 659, 784, 1047, 784, 659].forEach((f, i) => tono(f, i * 0.12, 0.16, 'sine', 0.1));   // ¡wiii!
  let s = 0;
  const paso = () => {
    s = Math.min(1, s + 0.045);
    const [x, y] = puntoTobogan(t, s); p.x = x; p.y = y + 70; colocar(p);
    if (s < 1) { setTimeout(paso, 30); return; }
    p.x = fin[0]; p.y = fin[1]; p.pose = 'parado'; dibujarElem(p); colocar(p);
    burbuja(p, ['😄', '🤩', '🎉'][azar(3)]); sfx.caer(); guardar();

}
function tonoDesliz(f1, f2, t0, dur, tipo = 'sine', vol = 0.12) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = tipo; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

// ---------- Iglesia: el piano toca "Cristo me ama" y el coro canta ----------
let tocandoPiano = false;
function tocarPiano(piano) {
  if (tocandoPiano) return;
  tocandoPiano = true;
  const N = { C4: 262, D4: 294, E4: 330, G4: 392, A4: 440, C5: 523 };
  const frase = (a, b) => [[a, 1], ['E4', 1], ['E4', 1], ['D4', 1], ['E4', 1], ['G4', 1], ['G4', 2]].map(([n, d], i) => i === 0 ? [b || n, d] : [n, d]);
  const melodia = [...frase('G4'), ['A4', 1], ['A4', 1], ['C5', 1], ['A4', 1], ['A4', 1], ['G4', 1], ['G4', 2], ...frase('G4'), ['A4', 1], ['A4', 1], ['G4', 1], ['C4', 1], ['E4', 1], ['D4', 1], ['C4', 3]];
  const u = 0.34; let t = 0.2;
  for (const [n, d] of melodia) { tono(N[n], t, u * d * 1.2, 'triangle', 0.12); tono(N[n] / 2, t, u * d, 'sine', 0.06); t += u * d; }
  di('Cristo me ama, bien lo sé.', 'Jesus loves me, this I know.');
  const coro = () => enEscena().filter(p => p.k === 'per' && Math.abs(p.y - CORO.y) < 4 && p.x > CORO.x0 && p.x < CORO.x1);
  let k = 0;
  const canta = setInterval(() => {
    burbuja(piano, ['🎵', '🎶'][k % 2]);
    for (const p of coro()) { const s = elems.get(p.id)?.querySelector('svg'); s?.classList.toggle('comiendo', k % 2 === 0); if (k % 2 === 0) burbuja(p, ['🎵', '🎶', '♪'][azar(3)]); }
    k++;
  }, 520);
  setTimeout(() => {
    clearInterval(canta); tocandoPiano = false;
    for (const p of enEscena()) if (p.k === 'per') elems.get(p.id)?.querySelector('svg')?.classList.remove('comiendo');
  }, t * 1000);
}

// ---------- Mover con el dedo: arrastrar cosas y personajes, o deslizar para ver el lugar ----------
let toque = null;   // { id, x0, y0, dx, dy, arrastrando } o { pan, x0, cam0 }
const DESDE_MOCHILA = 'mochila';
function inicioToque(e) {
  audio();
  if (e.target.closest('.lugar')) return;
  if (e.target.closest('.botonPiz')) return;
  const tiza = e.target.closest('.tiza');
  if (tiza) { toque = { tiza, ultimo: puntoTiza(tiza, e) }; try { vista.setPointerCapture(e.pointerId); } catch {} return; }
  const elEnt = e.target.closest('.ent');
  if (modoPintar && !elEnt) { pintar(e.target); return; }
  if (elEnt) {
    const en = ent(+elEnt.dataset.id); if (!en) return;
    const [mx, my] = aMundo(e.clientX, e.clientY);
    toque = { id: en.id, x0: e.clientX, y0: e.clientY, dx: mx - en.x, dy: my - en.y, arrastrando: false, fijo: !!CATde(en)?.fijo };
  } else toque = { pan: true, x0: e.clientX, cam0: camX };
  try { vista.setPointerCapture(e.pointerId); } catch {}
}
function levantar(en) {
  toque.arrastrando = true;

  if (en.dueno) { en.dueno = null; toque.dx = 0; toque.dy = -30; }
  en.sobre = null;
  if (estilo?.p === en) cerrarEstilista();
  if (en.nadando) { en.nadando = false; elems.get(en.id)?.classList.remove('nadando'); }
  if (en.flota) { en.flota = false; elems.get(en.id)?.classList.remove('flotando'); }
  if (elems.get(en.id)?.classList.contains('columpiando')) actualizarColumpios();
  if (ent(en.asiento?.id)?.k === 'rayos_x' || enEscena().some(o => o.k === 'rayos_x' && o.on)) setTimeout(actualizarMaquinas, 0);
  elems.get(en.id).classList.add('levantado'); elems.get(en.id).classList.remove('cae', 'flota');
  sfx.levantar();
  $('basura').classList.toggle('ver', en.k !== 'per');
}
function movToque(e) {
  if (!toque) return;
  ultimoPuntero = [e.clientX, e.clientY];
  if (toque.tiza) { const p = puntoTiza(toque.tiza, e), g = toque.tiza.getContext('2d'); g.strokeStyle = colorTiza; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(...toque.ultimo); g.lineTo(...p); g.stroke(); toque.ultimo = p; return; }
  if (toque.pan) { camX = toque.cam0 - (e.clientX - toque.x0) / S; aplicarCam(); return; }
  const en = ent(toque.id); if (!en) return;
  if (!toque.arrastrando && toque.fijo) {   // lo fijo no se mueve: de una caja del mercado sale uno nuevo; si no, se desliza el lugar
    if (Math.hypot(e.clientX - toque.x0, e.clientY - toque.y0) < 10) return;
    if (!CAT[en.k].fuente) { toque = { pan: true, x0: toque.x0, cam0: camX }; return; }
    const [mx, my] = aMundo(e.clientX, e.clientY);
    const n = { id: E.sigId++, k: en.de, esc: E.esc, x: mx, y: my + 33 };
    if (en.color) n.color = en.color;
    E.ents.push(n); crearElem(n); colocar(n);
    toque = { id: n.id, x0: toque.x0, y0: toque.y0, dx: 0, dy: -33, arrastrando: false };
    levantar(n); moverArrastre(); return;
  }
  if (!toque.arrastrando) { if (Math.hypot(e.clientX - toque.x0, e.clientY - toque.y0) < 10) return; levantar(en); }
  moverArrastre();
}
let ultimoPuntero = [0, 0];
function moverArrastre() {
  const en = ent(toque.id); if (!en) return;
  const [mx, my] = aMundo(...ultimoPuntero);
  en.x = mx - toque.dx; en.y = my - toque.dy;   // dx, dy: dónde se tomó (la base queda abajo del dedo)
  colocar(en);
  $('bolsillo').classList.toggle('resalta', sobreMochila());
  $('basura').classList.toggle('encima', sobreBasura());
}
const sobreMochila = () => ultimoPuntero[1] > innerHeight - 84;
function sobreBasura() { if (!$('basura').classList.contains('ver')) return false; const r = $('basura').getBoundingClientRect(); return ultimoPuntero[0] > r.left - 10 && ultimoPuntero[1] < r.bottom + 10; }
function finToque() {
  if (!toque) return;
  const t = toque; toque = null;
  if (t.tiza) return;
  if (t.pan) { E.cam[E.esc] = camX; return; }
  const en = ent(t.id); if (!en) return;
  if (!t.arrastrando) { tocar(en); return; }
  elems.get(en.id)?.classList.remove('levantado');
  $('bolsillo').classList.remove('resalta'); $('basura').classList.remove('ver', 'encima');
  const [mx, my] = aMundo(...ultimoPuntero);
  if (ultimoPuntero[1] > innerHeight - 84) { aMochila(en); return; }
  if (en.k !== 'per' && ultimoEnBasura) { borrar(en); return; }
  if (en.k === 'per') { const b = busEn(mx, my); if (b) { abordar(en, b); return; } }
  if (en.k === 'per') { const av = avionEn(mx, my); if (av) { abordarAvion(en, av); return; } }
  if (SIEMBRA.includes(en.k) || CAT[en.k]?.riega) { const s = surcoEn(mx, my); if (s && (CAT[en.k].riega ? s.planta && s.fase < 3 : !s.planta)) { CAT[en.k].riega ? regar(s, en) : sembrar(s, en); return; } }
  if (CAT[en.k]?.arena) { const ca = castilloEn(mx, my); if (ca) { construirCastillo(ca, en); return; } }
  if (ING_PIZZA.includes(en.k)) { const pz = pizzaEn(mx, my); if (pz) { ponerEnPizza(pz, en); return; } }
  if (CAT[en.k]?.apaga) { const fu = fuegoEn(mx, my); if (fu) { apagar(fu, en); return; } }
  if (CAT[en.k]?.herramienta) { const p = personajeEn(mx, my, null); if (p) { usarHerramienta(p, en); return; } }
  if (CAT[en.k]?.prenda) { const p = personajeEn(mx, my, null); if (p) { vestir(p, en); return; } }
  if (CAT[en.k]?.comida && !utensilioEn(mx, my, en)) { const m = mascotaEn(mx, my); if (m) { comerMascota(m, en); return; } }
  if (CAT[en.k]?.t === 'cosa' && CAT[en.k].comida) {   // ingredientes a la olla o a la licuadora
    const u = utensilioEn(mx, my, en);
    if (u) { echarA(u, en); return; }
  }
  if (en.k !== 'per') { const p = personajeEn(mx, my, null); if (p && CAT[en.k].t === 'cosa') { darA(p, en); return; } }
  soltarEn(en, en.x, en.y);
}
let ultimoEnBasura = false;
vista.addEventListener('pointerdown', inicioToque);
addEventListener('pointermove', e => { movToque(e); ultimoEnBasura = sobreBasura(); });
addEventListener('pointerup', finToque);
addEventListener('pointercancel', finToque);
// Al arrastrar cerca de la orilla, el lugar se mueve solo
(function orilla() {
  if (toque?.arrastrando) {
    const x = ultimoPuntero[0], v = x < 60 ? -14 : x > innerWidth - 60 ? 14 : 0;
    if (v) { camX += v / S; aplicarCam(); moverArrastre(); }
  }
  requestAnimationFrame(orilla);
})();
function borrar(en) {
  for (const o of E.ents) { if (o.dueno === en.id) o.dueno = null; if (o.sobre?.id === en.id) o.sobre = null; if (o.asiento?.id === en.id) o.asiento = null; }
  E.ents = E.ents.filter(o => o !== en); elems.get(en.id)?.remove(); elems.delete(en.id);
  lienzo.querySelector(`.brillo[data-de="${en.id}"]`)?.remove();
  for (const o of enEscena()) if (o.k === 'per' || !o.sobre) colocar(o);
  tono(300, 0, 0.12, 'sine', 0.12); tono(200, 0.08, 0.15, 'sine', 0.12); guardar();
}

// ---------- La mochila: llevar personajes y cosas de un lugar a otro ----------
const MAX_MOCHILA = 8;
function aMochila(en) {
  if (E.bolsillo.length >= MAX_MOCHILA) { toast('🎒 ' + T('¡La mochila está llena!', 'The backpack is full!')); soltarEn(en, en.x, en.y); return; }
  for (const o of E.ents) if (o.dueno === en.id) { o.esc = DESDE_MOCHILA; o.dueno = en.id; }   // lo que lleva en la mano va con él
  en.esc = DESDE_MOCHILA; en.asiento = null; en.sobre = null; en.pose = 'parado';
  E.bolsillo.push(en.id);
  elems.get(en.id)?.remove(); elems.delete(en.id);
  for (const o of E.ents) if (o.dueno === en.id) { elems.get(o.id)?.remove(); elems.delete(o.id); }
  lienzo.querySelector(`.brillo[data-de="${en.id}"]`)?.remove();
  sfx.mochila(); pintarBolsillo(); guardar();
}
function miniatura(en) {
  if (en.k === 'per') return svgPersonaje({ ...en, pose: 'parado' }).replace('viewBox="0 0 120 240"', 'viewBox="10 0 100 100"');
  const c = CAT[en.k]; return c.emo || c.svg(en);
}
function pintarBolsillo() {
  const r = $('ranuras'); r.innerHTML = '';
  for (const id of E.bolsillo) {
    const en = ent(id); if (!en) continue;
    const b = document.createElement('div'); b.className = 'ranura'; b.innerHTML = miniatura(en);
    b.addEventListener('pointerdown', ev => {   // sacar de la mochila: se arrastra al lugar
      audio();
      if (E.esc === 'mapa') { toast('🗺️ ' + T('Entra a un lugar para sacarlo', 'Go into a place to take it out')); return; }
      E.bolsillo = E.bolsillo.filter(x => x !== id);
      en.esc = E.esc;
      const [mx, my] = aMundo(ev.clientX, ev.clientY);
      const [, h] = medidas(en);
      en.x = mx; en.y = Math.min(my + h * 0.4, PISO);
      crearElem(en);
      for (const o of E.ents) if (o.dueno === en.id && o.esc === DESDE_MOCHILA) { o.esc = E.esc; crearElem(o); }
      colocar(en);
      ultimoPuntero = [ev.clientX, ev.clientY];
      toque = { id: en.id, x0: ev.clientX, y0: ev.clientY, dx: 0, dy: -h * 0.4, arrastrando: false };
      levantar(en); moverArrastre(); pintarBolsillo();
      try { vista.setPointerCapture(ev.pointerId); } catch {}
    });
    r.appendChild(b);
  }
  for (let k = E.bolsillo.length; k < 4; k++) r.insertAdjacentHTML('beforeend', '<div class="ranura" style="opacity:.5"></div>');
}

// ---------- Muebles y juguetes nuevos, y pintar paredes y pisos ----------
function cerrarCajones() { cerrarEstilista(); $('rutas').classList.remove('abierto'); document.getElementById('cielo').classList.remove('abierto'); document.getElementById('vuelos').classList.remove('abierto'); $('creador').classList.remove('abierto'); ['cajon', 'paleta'].forEach(id => $(id).classList.remove('abierto')); $('bMuebles').classList.remove('on'); $('bPintar').classList.remove('on'); modoPintar = false; }
$('bMuebles').onclick = () => {
  audio(); const abrir = !$('cajon').classList.contains('abierto'); cerrarCajones();
  if (!abrir) return;
  $('cajon').classList.add('abierto'); $('bMuebles').classList.add('on');
  const c = $('cajon'); c.innerHTML = '';
  for (const k of CAJON) {
    const b = document.createElement('button'); b.innerHTML = CAT[k].emo || CAT[k].svg({});
    b.onclick = () => {
      const vw = vista.clientWidth / S, x = camX + vw / 2 + (Math.random() - 0.5) * 200;
      const n = { id: E.sigId++, k, esc: E.esc, x, y: CAT[k].pegado ? 380 : 120 };
      E.ents.push(n); crearElem(n); soltarEn(n, x, n.y); di(CAT[k].es, CAT[k].en);
    };
    c.appendChild(b);
  }
};
let modoPintar = false, colorPintar = '#fde2e4';
const COLORES_PARED = ['#fde2e4', '#fecaca', '#fef3c7', '#d1fae5', '#cffafe', '#e0e7ff', '#f3e8ff', '#ffffff', '#c08457', '#cbd5e1', '#86efac', '#fda4af'];
$('bPintar').onclick = () => {
  audio(); const abrir = !$('paleta').classList.contains('abierto'); cerrarCajones();
  if (!abrir) return;
  modoPintar = true; $('paleta').classList.add('abierto'); $('bPintar').classList.add('on');
  const p = $('paleta'); p.innerHTML = `<span class="ayuda">🖌️</span>`;
  for (const col of COLORES_PARED) {
    const b = document.createElement('button'); b.style.background = col; b.className = col === colorPintar ? 'sel' : '';
    b.onclick = () => { colorPintar = col; p.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); sfx.pop(); };
    p.appendChild(b);
  }
  di('Elige un color y toca una pared o un piso.', 'Pick a color and tap a wall or a floor.');
};
function pintar(objetivo) {
  const zona = objetivo.closest('[data-pintar]'); if (!zona || E.esc !== 'casa') return;
  const i = +zona.dataset.i, tipo = zona.dataset.pintar;
  E.colores.casa[tipo][i] = colorPintar; zona.style.background = colorPintar;
  sfx.agua(); guardar();
}

// ---------- Día y noche ----------
function pintarNoche() {
  $('bNoche').textContent = icoCielo();
  lienzo.classList.toggle('noche', E.noche);
  lienzo.querySelectorAll('.ventana .astro').forEach(a => a.textContent = icoCielo());
}
// El botón del cielo abre: las 4 estaciones (en orden), y abajo día/noche, clima y fiestas
$('bNoche').onclick = () => {
  audio(); const abrir = !$('cielo').classList.contains('abierto'); cerrarCajones();
  if (!abrir) return;
  const fe = $('estacionesLista'), f = $('cieloLista'); fe.innerHTML = ''; f.innerHTML = '';
  const op = (fila, ico, fn, sel, texto) => {
    const b = document.createElement('button'); b.className = sel ? 'sel' : '';
    b.innerHTML = `<span style="font-size:${texto ? 26 : 34}px;line-height:1">${ico}</span>${texto ? `<small style="font-size:10px;font-weight:800">${texto}</small>` : ''}`;
    b.onclick = () => { audio(); fn(); $('cielo').classList.remove('abierto'); }; fila.appendChild(b);
  };
  for (const [k, s] of Object.entries(ESTACIONES)) op(fe, s.ico, () => cambiarEstacion(k), (E.estacion || 'verano') === k, { primavera: T('Primavera', 'Spring'), verano: T('Verano', 'Summer'), otono: T('Otoño', 'Fall'), invierno: T('Invierno', 'Winter') }[k].split(' · ')[0]);
  op(f, '☀️', () => { if (E.noche) cambiarNoche(); else di('Es de día.', "It's daytime."); }, !E.noche);
  op(f, '🌙', () => { if (!E.noche) cambiarNoche(); }, E.noche);
  for (const k of Object.keys(CLIMAS)) op(f, CLIMAS[k].ico, () => cambiarClima(k), (E.clima || 'sol') === k);
  for (const k of ['cumple', 'navidad']) op(f, FIESTAS[k].ico, () => cambiarFiesta(E.fiesta === k ? '' : k), E.fiesta === k);
  $('cielo').classList.add('abierto'); sfx.pop();
};
function cambiarNoche() {
  E.noche = !E.noche; guardar();
  if (['mapa', 'iglesia', 'escuela', 'doctor', 'granja', 'playa'].includes(E.esc)) construir(); else pintarNoche();
  E.noche ? [784, 659, 523].forEach((f, i) => tono(f, i * 0.15, 0.3, 'sine', 0.08)) : [523, 659, 784].forEach((f, i) => tono(f, i * 0.12, 0.25, 'triangle', 0.08));
  if (E.noche) for (const p of enEscena()) if (p.pose === 'acostado') burbuja(p, '💤');
  di(E.noche ? 'Buenas noches' : 'Buenos días', E.noche ? 'Good night' : 'Good morning');
};
$('bMapa').onclick = () => { audio(); if (E.esc !== 'mapa') irA('mapa'); };

// ---------- Ajustes para adultos (mantener 🔒 3 segundos) ----------
const bCand = $('candado');
let tCand = null;
bCand.addEventListener('pointerdown', () => { bCand.classList.add('cargando'); tCand = setTimeout(() => { tCand = null; bCand.classList.remove('cargando'); abrirPanel(); }, 3000); });
const soltarCandado = () => { if (tCand) { clearTimeout(tCand); tCand = null; bCand.classList.remove('cargando'); } };
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bCand.addEventListener(t, soltarCandado));
addEventListener('contextmenu', e => e.preventDefault());
function abrirPanel() {
  const cont = $('pIdioma'); cont.innerHTML = '';
  for (const [v, txt] of [['es', 'Español'], ['en', 'English'], ['ambos', 'Bilingüe (español + English)']]) {
    const d = document.createElement('div'); d.className = 'opc';
    d.innerHTML = `<input type="radio" name="idioma" id="id-${v}" ${E.idioma === v ? 'checked' : ''}><label for="id-${v}">${txt}</label>`;
    d.querySelector('input').onchange = () => { E.idioma = v; guardar(); };
    cont.appendChild(d);
  }
  $('panel').classList.add('abierta');
}
$('bCerrarPanel').onclick = () => { $('panel').classList.remove('abierta'); construir(); };
$('bBorrarNuevos').onclick = () => {
  const nuevos = E.ents.filter(e => e.nuevo);
  if (!nuevos.length) { toast('No hay personajes creados'); return; }
  if (!confirm(`¿Borrar ${nuevos.length} personaje(s) creados en la cabina?`)) return;
  for (const n of nuevos) { for (const o of E.ents) if (o.dueno === n.id) o.dueno = null; }
  E.ents = E.ents.filter(e => !e.nuevo); E.bolsillo = E.bolsillo.filter(id => ent(id));
  guardar(); toast('Listo'); construir();
};
$('bReiniciar').onclick = () => {
  if (!confirm('¿Borrar la casa, los muebles y los personajes y empezar de nuevo? Esto no se puede deshacer.')) return;
  const idioma = E.idioma; E = DEF(); E.idioma = idioma; migrar(); guardar(); $('panel').classList.remove('abierta'); construir();
};

construir(); pintarNoche();
</script>
